<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D7A8"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8942D"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0D0D0D"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Inner Border -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Fork (left tines) -->
  <path d="M32 28 L32 55 Q32 60 37 60 L37 72 L33 72 L33 65 Q33 62 30 62 L30 55 L30 28" 
        fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Knife (right) -->
  <path d="M68 28 L68 45 Q68 55 62 60 Q68 65 68 75 L72 75 L72 28" 
        fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Center M for Maestro -->
  <text x="50" y="58" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" 
        fill="url(#goldGrad)" filter="url(#glow)">M</text>
  
  <!-- Crown top -->
  <path d="M35 18 L40 12 L45 18 L50 8 L55 18 L60 12 L65 18" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Sparkles -->
  <circle cx="25" cy="25" r="1.5" fill="#E8D7A8" opacity="0.8"/>
  <circle cx="75" cy="25" r="1" fill="#E8D7A8" opacity="0.6"/>
  <circle cx="80" cy="50" r="1.5" fill="#D4AF37" opacity="0.8"/>
  <circle cx="20" cy="60" r="1" fill="#D4AF37" opacity="0.6"/>
</svg>
